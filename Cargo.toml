[workspace]
resolver = "3"
# Built-in core mods live under `mods/` (PLAN §6).
members = ["crates/*", "mods/*"]
# Vendored, patched third-party crates keep their own lints and are not members.
exclude = ["third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/happsie/coqo"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# gpui-base carries a small Coqo patch (remote edits for the editor, ADR 0007).
# See third_party/gpui-base/PATCHES.md. It is the exact 0.11.0 that gpui-kit pins.
[patch.crates-io]
gpui-base = { path = "third_party/gpui-base" }

[profile.release]
lto = "thin"
codegen-units = 1

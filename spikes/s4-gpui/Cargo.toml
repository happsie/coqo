[package]
name = "spike-s4-gpui"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Throwaway prototype for spike S4 (issue #11): GPUI + gpui-component editor capabilities."

# Standalone: not a member of the Coqo workspace, so CI does not build it.
[workspace]

[dependencies]
gpui-kit = { version = "=0.11.0", features = ["tree-sitter-rust", "test-support"] }
similar = "2"
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1

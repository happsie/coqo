# The git mod (PLAN §6, §7.7). Built in: it provides the `coqo.git@1`
# service at startup, which the daemon's `git/*` methods run on.
id = "coqo.git"
name = "Git"
version = "0.1.0"
description = "Status, diffs, hunk and line staging, commit, branches, stash, blame and log."
engine = "^0.0"
tier = "core"
activation = ["startup"]
provides = ["coqo.git@1.0"]

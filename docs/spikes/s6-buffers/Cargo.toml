[package]
name = "spike-s6-buffers"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Throwaway prototype for spike S6 (issue #13): UI<->daemon buffer replication, op-log vs yrs CRDT."

# Standalone: not a member of the Coqo workspace, so CI does not build it.
# `editor-map` (GPUI, headless) is a separate member so the core builds fast.
[workspace]
members = [".", "editor-map"]

[dependencies]
ropey = { version = "=2.0.0-beta.1", default-features = false, features = ["metric_lines_lf", "metric_utf16"] }
yrs = { version = "0.28", features = ["sync"] } # `sync`: UndoManager is !Send without it
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde_bytes = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
rand = { version = "0.9", features = ["small_rng"] }

[dev-dependencies]
proptest = "1"

[profile.release]
debug = 1

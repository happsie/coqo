[package]
name = "coqo-mcp"
description = "The coqo-editor MCP server (`coqod mcp`): a stdio MCP endpoint that bridges agents to the daemon, and its tool registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
coqo-client = { path = "../client" }
coqo-protocol = { path = "../protocol" }
# The official Rust MCP SDK (Apache-2.0). Only the server side over an
# async reader and writer: no HTTP, no OAuth, no chrono.
rmcp = { version = "3.12", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

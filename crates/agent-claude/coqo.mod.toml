# Claude Code through the Claude Agent ACP adapter (PLAN §7.3, ADR 0005).
# Built in: it registers the `claude` agent provider at startup.
id = "coqo.claude"
name = "Claude Code"
version = "0.1.0"
description = "Chat with your own Claude Code, signed in with your own login, through the Claude Agent ACP adapter."
engine = "^0.0"
tier = "core"
activation = ["startup"]

[[contributes.settings_sections]]
id = "claude"
title = "Claude Code"
description = "Coqo starts your own, unmodified Claude Code and you sign in there (claude /login). These are read when Coqo's daemon starts, so a change applies once it restarts."
order = 30

[[contributes.settings]]
key = "claude.acp.plan-logins"
title = "Use Claude plan logins through ACP"
description = "Let the Claude ACP adapter use the Claude.ai subscription login of your own `claude`. Turn it off to use only API keys and cloud providers (the adapter then runs with --hide-claude-auth)."
type = "boolean"
default = true

[[contributes.settings]]
key = "claude.guide"
title = "Append Coqo's operating guide to Claude's system prompt"
description = "Add a short guide on when to use Coqo's editor tools (editor_context, ask_question, set_status, ...) to Claude Code's own system prompt. Claude Code keeps its own prompt, your CLAUDE.md and settings. COQO_CLAUDE_GUIDE=0 in the daemon's environment also turns it off."
type = "boolean"
default = true

[[contributes.settings]]
key = "claude.plugin"
title = "Load Coqo's Claude Code plugin"
description = "Load Coqo's own Claude Code plugin (the coqo-walkthrough skill and /coqo:walkthrough) into Coqo's Claude sessions. Coqo keeps it in its data directory and passes it per session; nothing is installed into your Claude Code configuration. COQO_CLAUDE_PLUGIN=0 in the daemon's environment also turns it off."
type = "boolean"
default = true

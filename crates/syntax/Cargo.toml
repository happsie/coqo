[package]
name = "coqo-syntax"
description = "Coqo's always-on syntax layer: language registry, tree-sitter parsing, folding, outline and symbol tags. No GPUI, so the daemon and the UI share it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The built-in `coqo.syntax` mod contributes the bundled languages.
coqo-mod-api = { path = "../mod-api" }
# Same tree-sitter and grammar versions as gpui-component (coqo-ui's
# highlighter), so each grammar's C code is linked once. All MIT.
tree-sitter = "0.26.13"
tree-sitter-css = "0.23.2"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-md = "0.5.1"
tree-sitter-rust = "0.24.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7.1"

[lints]
workspace = true

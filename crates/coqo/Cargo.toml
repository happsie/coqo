[package]
name = "coqo"
description = "Coqo desktop UI (GPUI) and the `coqo` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The replica a file tab's editor drives (ADR 0006, ADR 0010).
coqo-buffers = { path = "../buffers" }
coqo-client = { path = "../client" }
coqo-protocol = { path = "../protocol" }
coqo-ui = { path = "../ui" }
# The per-user data directory for saved layouts (PLAN §8).
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Inline diffs of agent edits in the chat.
similar = "2"
# The daemon connection runs on its own tokio runtime; GPUI is not tokio.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
coqo-ui = { path = "../ui", features = ["test-support"] }
# UI tests run a real daemon in-process on a temporary socket.
coqod = { path = "../coqod" }
# Chat tests serve the real session manager with a scripted agent.
coqo-agents = { path = "../agents" }
coqo-mod-api = { path = "../mod-api" }
coqo-storage = { path = "../storage" }
tempfile = "3"

[lints]
workspace = true

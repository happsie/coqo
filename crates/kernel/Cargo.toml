[package]
name = "coqo-kernel"
description = "Coqo kernel: registry, services, supervisor and event log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
nix = { version = "0.30", default-features = false, features = ["signal", "process", "feature"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54", features = ["process", "io-util", "rt", "sync", "time", "macros", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

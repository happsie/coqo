[package]
name = "coqo-ui"
description = "Coqo UI facade over GPUI and gpui-component, plus the declarative view renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Pinned exactly: gpui-kit pins its `gpui-pre` snapshot of Zed's GPUI, and any
# release may change APIs. Upgrade deliberately (ADR 0002).
gpui-kit = "=0.11.0"
# Offscreen screenshots in test support; same major version GPUI uses.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# GPUI's test platform (no GPU needed) and window query helpers, for UI tests.
test-support = ["gpui-kit/test-support", "dep:image"]

[lints]
workspace = true

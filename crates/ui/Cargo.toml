[package]
name = "coqo-ui"
description = "Coqo UI facade over GPUI and gpui-component, plus the declarative view renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The bundled languages, by path or `#!` line (no GPUI in it).
coqo-syntax = { path = "../syntax" }
# Pinned exactly: gpui-kit pins its `gpui-pre` snapshot of Zed's GPUI, and any
# release may change APIs. Upgrade deliberately (ADR 0002).
# The tree-sitter features bundle the grammars the editor highlights with
# gpui-component's own queries; JSON comes with `tree-sitter` itself. The
# languages are coqo-syntax's (`editor::language_for_path`); one it has that
# gpui-component lacks (XML) is registered from coqo-syntax's grammar.
gpui-kit = { version = "=0.11.0", features = [
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Offscreen screenshots in test support; same major version GPUI uses.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui-kit = { version = "=0.11.0", features = ["test-support"] }

[features]
# GPUI's test platform (no GPU needed) and window query helpers, for UI tests.
test-support = ["gpui-kit/test-support", "dep:image"]

[lints]
workspace = true

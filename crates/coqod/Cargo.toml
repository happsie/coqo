[package]
name = "coqod"
description = "Coqo background daemon (coqod), including the `coqod mcp` mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "coqod"
path = "src/main.rs"
# The library has the same name; document only the library.
doc = false

# The scripted ACP agent from coqo-acp-host, standing in for a real agent in
# this crate's integration tests (agents' terminals, #185).
[[bin]]
name = "coqod-fake-acp-agent"
path = "src/bin/fake_acp_agent.rs"
test = false
doc = false

[dependencies]
# Terminal emulation (grid, scrollback, escape sequences). Apache-2.0; the
# crate Alacritty and Zed use.
alacritty_terminal = "0.26"
anyhow = "1"
coqo-acp-host = { path = "../acp-host" }
# Built-in Claude Code provider (a core mod outside `mods/`: it needs the ACP
# host, which mods may not depend on).
coqo-agent-claude = { path = "../agent-claude" }
coqo-agents = { path = "../agents" }
# Anchors of questions and notes pinned to code (`questions/*`).
coqo-anchors = { path = "../anchors" }
coqo-buffers = { path = "../buffers" }
coqo-client = { path = "../client" }
coqo-kernel = { path = "../kernel" }
# `coqod mcp`: the coqo-editor MCP server.
coqo-mcp = { path = "../mcp" }
coqo-mod-api = { path = "../mod-api" }
# Built-in core mods (see src/mods.rs).
coqo-mod-hello = { path = "../../mods/hello" }
# `git/*` runs on its `coqo.git@1` service.
coqo-mod-git = { path = "../../mods/git" }
coqo-protocol = { path = "../protocol" }
coqo-storage = { path = "../storage" }
# The always-on syntax layer: `syntax/*` and the built-in `coqo.syntax` mod.
coqo-syntax = { path = "../syntax" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.3", features = ["std"] }
ignore = "0.4"
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal"] }
notify = "8"
# Cross-platform PTYs (MIT, from wezterm).
portable-pty = "0.9"
rusqlite = "0.43"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
# `fs/delete` moves entries to the OS trash (MIT; the freedesktop.org trash
# on Linux, the Finder's on macOS).
trash = "5"

[dev-dependencies]
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[lints]
workspace = true

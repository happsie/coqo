[package]
name = "coqod"
description = "Coqo background daemon (coqod), including the `coqod mcp` mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "coqod"
path = "src/main.rs"
# The library has the same name; document only the library.
doc = false

[dependencies]
# Terminal emulation (grid, scrollback, escape sequences). Apache-2.0; the
# crate Alacritty and Zed use.
alacritty_terminal = "0.26"
anyhow = "1"
coqo-agents = { path = "../agents" }
coqo-buffers = { path = "../buffers" }
coqo-client = { path = "../client" }
coqo-kernel = { path = "../kernel" }
coqo-mod-api = { path = "../mod-api" }
# Built-in core mods (see src/mods.rs).
coqo-mod-hello = { path = "../../mods/hello" }
coqo-protocol = { path = "../protocol" }
coqo-storage = { path = "../storage" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.3", features = ["std"] }
ignore = "0.4"
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal"] }
notify = "8"
# Cross-platform PTYs (MIT, from wezterm).
portable-pty = "0.9"
rusqlite = "0.43"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[lints]
workspace = true

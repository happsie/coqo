[package]
name = "coqo-mod-api"
description = "Public Coqo mod API: the only Coqo crate that mods may depend on."
# The mod API has its own version (mods declare `engine = "^0.0"`); it is not
# the app release version, so it stays put when the workspace version moves.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Keep this list short: every mod depends on this crate. Never add another
# Coqo crate here (PLAN §5).
[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
